formatter: markdown table
output:
  file: README.md
  mode: inject
sort:
  enabled: true
  by: name
settings:
  anchor: false
  default: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
content: |-
  {{ .Requirements }}

  {{ .Providers }}

  {{ .Resources }}

  {{ .Inputs }}

  {{ .Outputs }}
